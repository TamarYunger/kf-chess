name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # windows-latest, not ubuntu: this project is Windows-only today (see
    # CLAUDE.md - client/view/sound.py's winsound, client/view/img.py's cv2
    # window) - an ubuntu runner would need extra system libraries just to
    # import opencv-python, for a platform the game doesn't actually run on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # windows-latest ships PostgreSQL pre-installed but not running (see
      # actions/runner-images' software manifest) - tests/test_db_postgres.py
      # needs a real instance to test PostgresAccountStore's actual SQL
      # against (see server/db.py), not a mock, so this starts the
      # pre-installed service and creates the same kfchess/kfchess
      # user+database that docker-compose.yml's postgres service uses
      # locally, instead of reaching for `# pragma: no cover`.
      - name: Start PostgreSQL and create the kfchess database
        # The pre-installed PostgreSQL 17 Windows *service* refuses to
        # start on this runner image with a generic SCM-level error that
        # leaves no trace anywhere (not PostgreSQL's own log, not the
        # System event log's Service Control Manager entries - confirmed
        # across several prior attempts). But the data directory itself is
        # a genuine, already-initialized PG data dir that PostgreSQL can
        # demonstrably run against (its own log shows a clean startup/
        # shutdown from when the runner image was built) - so the problem
        # is specifically with Windows' service wrapper, not PostgreSQL.
        # Skip the service entirely and run pg_ctl directly instead.
        shell: pwsh
        run: |
          $service = Get-CimInstance Win32_Service -Filter "Name LIKE 'postgresql%'" | Select-Object -First 1
          $dataDir = if ($service.PathName -match '-D\s*"?([^"]+?)"?(\s|$)') { $Matches[1] } else { $null }
          if (-not $dataDir) { throw "Could not resolve PostgreSQL data dir from service PathName: $($service.PathName)" }

          # The pre-installed instance's postgres superuser password isn't
          # "postgres" (confirmed: pg_ctl start succeeds, but psql then gets
          # password authentication failed) and isn't documented anywhere -
          # this VM is torn down right after the job, so instead of guessing
          # a password, just trust local connections outright. Edited before
          # starting the server so postgres picks it up on its own at boot.
          $hbaPath = Join-Path $dataDir "pg_hba.conf"
          "host all all 127.0.0.1/32 trust`nhost all all ::1/128 trust`n" + (Get-Content $hbaPath -Raw) |
            Set-Content $hbaPath

          $startupLog = Join-Path $dataDir "log\startup.log"
          & "$env:PGBIN\pg_ctl.exe" start -D $dataDir -l $startupLog -w
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pg_ctl start failed with exit code $LASTEXITCODE"
            Get-Content $startupLog -Tail 50 -ErrorAction SilentlyContinue
            throw "pg_ctl start failed"
          }

          & "$env:PGBIN\psql" -U postgres -h localhost -c "CREATE USER kfchess WITH PASSWORD 'kfchess';"
          & "$env:PGBIN\psql" -U postgres -h localhost -c "CREATE DATABASE kfchess OWNER kfchess;"

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=100
