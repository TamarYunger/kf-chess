services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nats:
    image: nats:2-alpine
    ports: ["4222:4222"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
      POSTGRES_DB: kfchess
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfchess"]
      interval: 10s
      timeout: 3s
      retries: 3

  api-gateway:
    build: .
    command: ["python", "-m", "server.api_gateway"]
    ports: ["8080:8080"]
    environment:
      KF_CHESS_HOST: "0.0.0.0"
      DB_BACKEND: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "kfchess"
      POSTGRES_USER: "kfchess"
      POSTGRES_PASSWORD: "kfchess"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-shard:
    build: .
    command: ["python", "-m", "server.shard"]
    environment:
      DB_BACKEND: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "kfchess"
      POSTGRES_USER: "kfchess"
      POSTGRES_PASSWORD: "kfchess"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  matchmaker:
    build: .
    command: ["python", "-m", "server.matchmaker_service"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  allocator:
    build: .
    command: ["python", "-m", "server.allocator_service"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ws-server:
    build: .
    ports: ["8765:8765"]
    environment:
      KF_CHESS_HOST: "0.0.0.0"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      api-gateway:
        condition: service_healthy
      game-shard:
        condition: service_healthy
      matchmaker:
        condition: service_healthy
      allocator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
